[project]
name = "intent-bridge"
version = "0.1.0"
description = "Neurosymbolic verification of whether an implementation realizes a stated intention. LLM proposes; SMT/property-testing disposes."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Bridge contributors" }]
license = { text = "Apache-2.0" }

dependencies = [
    # Symbolic engine: the truth oracle. Always invoked; the LLM may
    # never short-circuit it on a VERIFIED verdict.
    "z3-solver>=4.13",

    # Property-based testing: complementary to symbolic execution when
    # the function is outside z3's decidable fragment.
    "hypothesis>=6.100",

    # Strict schema validation on every LLM output. No free-form JSON
    # is allowed through the protocol boundary.
    "pydantic>=2.7",

    # LLM client: OpenAI-compatible API surface, talks to OpenRouter
    # (which fans out to any provider). We deliberately bind to the
    # interface, not the vendor.
    "openai>=1.40",

    # CLI ergonomics.
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
bridge = "intent_bridge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intent_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: tests that hit a real LLM (require OPENROUTER_API_KEY). Skip by default.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/intent_bridge"]
